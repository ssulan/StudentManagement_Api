<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Student Info System</title>

    <style>
        .list-student #studentListBtn {
            padding-inline: 50px;
        }

        .formBtn .btn {
            padding-inline: 40px;
            margin-inline: 6px;
        }

        .container #studentForm {
            border: solid grey;
            border-radius: 2%;
            width: 40%;
            margin-left: 35%;
            padding: 10px;
        }
    </style>

    <!--Bootstrapt CSS linki-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <div class="container mt-3">
        <h3 class="text-center">Register</h3>

        <form id="studentForm">

            <div class="mb-3">
                <label for="name" class="form-label">First Name</label>
                <input type="text" class="form-control" id="name" name="FirstName" required maxlength="50" minlength="3">
            </div>

            <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" name="LastName" required maxlength="100" minlength="2">
            </div>

            <div class="mb-3">
                <label for="number" class="form-label">Number</label>
                <input type="text" class="form-control" id="number" name="Number" required minlength="5" maxlength="5">
            </div>

            <div class="mb-3">
                <label for="class" class="form-label">Class</label>
                <input type="text" class="form-control" id="class" name="Branch" required maxlength="1">
            </div>

            <div class="formBtn">
                <button type="submit" class="btn btn-primary">Add</button>
                <button type="button" id="updateBtn" class="btn btn-primary">Update</button>
                <button type="button" id="deleteBtn" class="btn btn-primary">Delete</button>

            </div>
        </form>

        <div id="message"></div>

        <div class="list-student mt-5">

            <h2>
                List of Student
                <button type="button" id="studentListBtn" class="btn btn-primary ms-2">List</button>
            </h2>

            <table class="table table-striped table-hover">
                <thead>
                    <tr>
                        <td>Number</td>
                        <td>First Name</td>
                        <td>Last Name</td>
                        <td>Class</td>
                    </tr>
                </thead>
                <tbody class="tBody">
                </tbody>
            </table>

        </div>

    </div>


    <!--VARIABLES-->
    <script>const apiBase = "https://localhost:7153/api/Students";
        let messageDiv = document.getElementById("message");
        const form = document.getElementById("studentForm");
        let msg = "";</script>


    <!--GET METHOD-->
    <script>const listBtn = document.getElementById("studentListBtn");
        const tableBody = document.querySelector(".tBody");

        listBtn.addEventListener("click", getList);

        async function getList() {
            messageDiv.innerHTML = "";
            tableBody.innerHTML = "";

            try {

                const res = await fetch(`${apiBase}/get`);


                if (!res.ok) {
                    msg = await res.text();// Read Backend message
                    messageDiv.innerHTML = `<p style='color:blue;'>${msg}</p>`;
                    return; //early return
                }

                const data = await res.json();

                data.forEach(student => {

                    const tRow = document.createElement("tr"); //create row element for table

                    //Object.values(): ignore keys,returns values
                    Object.values(student).forEach(value => {

                        let tData = document.createElement("td"); // create td element
                        tData.textContent = value;

                        tRow.appendChild(tData); //append td in trow

                    });

                    tableBody.appendChild(tRow); //append trow in table body
                });

            }
            catch (err) {
                messageDiv.innerHTML = "<p style='color:red;'>Could not fetch data: " + err.message + "</p>";
                console.error(err);
            }


        }</script>


    <!--POST METHOD-->
    <script>form.addEventListener("submit", async (e) => {
            e.preventDefault();

            //Create FormData
            const formData = new FormData(form);

            await FetchHelper(`${apiBase}/register`, {
                method: 'POST',
                body: formData
            });

        });</script>


    <!--UPDATE METHOD-->
    <script>const updateBtn = document.querySelector("#updateBtn");

        updateBtn.addEventListener("click", async (e) => {
            e.preventDefault();
            const formData = new FormData(form);

            if (!formDataValidation(formData)) {
                return;//early return
            }

            const number = formData.get("Number");
            await FetchHelper(`${apiBase}/update/${number}`, {
                method: 'PUT',
                body: formData
            });

        });


        function formDataValidation(formData) {

            //formDat.entries(): returns keys and values
            for (const [key, value] of formData.entries()) {
                const val = value.trim(); //remove spaces

                switch (key) {
                    case "FirstName":
                        if (val.length < 3) {
                            messageDiv.innerHTML = `<p style='color:red;'><strong>${key}</strong> field is must be at least 3 character.</p>`;
                            return false;
                        }
                        break;
                    case "LastName":
                        if (val.length < 2) {
                            messageDiv.innerHTML = `<p style='color:red;'><strong>${key}</strong> field is must be at least 2 character.</p>`;
                            return false;
                        }
                        break;
                    case "Number":
                        if (val.length != 5) {
                            messageDiv.innerHTML = `<p style='color:red;'><strong>${key}</strong> must be between 5 character.</p>`;
                            return false;
                        }
                        break;
                    case "Branch":
                        if (!val) {
                            messageDiv.innerHTML = `<p style='color:red;'><strong>${key}</strong> cannot be empty.</p>`;
                            return false;
                        }
                        break;
                }
            }

            return true;
        }</script>

    <!--DELETE METHOD-->
    <script>const deleteBtn = document.querySelector("#deleteBtn");
        deleteBtn.addEventListener("click", async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const number = formData.get("Number");
            messageDiv.innerHTML = "";
            if (!number) {
                messageDiv.innerHTML = "<p style='color:red;'>Please enter a student number.</p>";
                return;
            }

            await FetchHelper(`${apiBase}/delete/${number}`, {
                method: 'DELETE'
            });

        });
    </script>



    <!--Fetch Helper Method-->
    <script>async function FetchHelper(url, options = {}) {

            messageDiv.innerHTML = "";

            try {
                const res = await fetch(url, options);

                msg = await res.text(); //read backend message
                if (!res.ok) {
                    messageDiv.innerHTML = `<p style='color:red;'>${msg}</p>`;
                    return;
                }

                messageDiv.innerHTML = `<p style='color:green;'>${msg}</p>`;
                form.reset();


            }
            catch (err) {
                messageDiv.innerHTML = "<span>Server is unreachable!</span>";
                console.log(err);
                throw err;

            }

        }</script>

    <!--Bootstrapt JS linki-->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
